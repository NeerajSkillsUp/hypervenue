version: '3.8'

services:
  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hypervenue_auth
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports: ["5432:5432"]
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-booking:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hypervenue_booking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports: ["5433:5432"]
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo-food:
    image: mongo:6.0
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  auth-data:
  booking-data:
  mongo-data: